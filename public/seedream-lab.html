<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seedream Lab</title><style>*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f5f6f8;color:#20242b;margin:0}main{max-width:1000px;margin:32px auto;padding:20px}h1{font-size:26px;margin:0}p{color:#626975}section{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,button{font:inherit}input[type=password],textarea{width:100%;padding:12px;border:1px solid #ccd0d5;border-radius:8px}textarea{min-height:220px;resize:vertical}.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{border:1px solid #ddd;padding:12px;border-radius:10px;overflow:hidden}.tile img{width:100%;height:160px;object-fit:contain;background:#fafafa}.tile input{width:100%;font-size:12px}button,a.download{display:inline-block;background:#20242b;color:white;padding:12px 22px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#result{max-width:100%;max-height:700px;object-fit:contain;display:block;margin:15px auto}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>Seedream Lab</h1><p>Flash 260915 · 1.5K · Smart ratio · Raw output</p><section><form id="form"><label>Ark API Key (ของคุณเอง)</label><input type="password" name="key" required autocomplete="off" placeholder="API key"><p>ไม่บันทึกคีย์หรือรูปลงฐานข้อมูล ใช้คีย์ของคุณสำหรับเรียก Seedream โดยตรงผ่านเซิร์ฟเวอร์</p><div class="refs"><div class="tile"><label>1. รูปคน</label><img hidden><input type="file" name="person" accept="image/png,image/jpeg,image/webp" required></div><div class="tile"><label>2. รูปชุด</label><img hidden><input type="file" name="outfit" accept="image/png,image/jpeg,image/webp" required></div><div class="tile"><label>3. รูปผม</label><img hidden><input type="file" name="hair" accept="image/png,image/jpeg,image/webp" required></div></div><label>Prompt</label><textarea name="prompt" required>Combine the three reference images into one premium, photorealistic female studio ID portrait.REFERENCE ASSIGNMENT:Image 2: Fixed clothing and body template. Preserve the original garment geometry, dimensions, shoulder width, collar height, lapels, tie, buttons, insignia, fabric color, and silhouette.Image 1: Original facial identity only. Preserve the person's exact recognizable facial features. Ignore the original hairstyle, clothing, body proportions, camera distance, and image framing.Image 3: Mandatory hairstyle reference. Replace the original hairstyle completely with this exact hairstyle.PRIORITY 1 — FIXED GARMENT AND BODY GEOMETRYUse Image 2 as the fixed spatial foundation of the entire portrait, not merely as a clothing style reference.Preserve the original garment width, shoulder height, shoulder slope, collar position, torso volume, and bottom boundary.Do not shrink, narrow, elongate, stretch, or redesign the garment.Maintain the exact proportions and appearance of all buttons, shoulder boards, embroidery, seams, and official insignia.The head and neck must fit naturally into the existing garment geometry. Never modify the garment geometry to accommodate the head.PRIORITY 2 — NATURAL HEAD AND NECK PROPORTIONSCreate a balanced, elegant, anatomically realistic adult female portrait.Determine head size using anatomical facial landmarks and shoulder width, independently of hairstyle volume.Maintain facial width at approximately 36–40% of anatomical shoulder width, provided this remains anatomically natural.Keep the head naturally proportioned to the full shoulder and torso width.Position the chin naturally close to the collar, with a compact and realistic exposed neck.Avoid excessive neck length, oversized head, narrow shoulders, undersized body, and unnatural head-to-body proportions.Never enlarge the head to shorten the apparent neck.Keep the head, neck, collar, and body aligned along the same vertical centerline.The final proportions should resemble a professionally fitted photographic portrait using the original PNG clothing template.PRIORITY 3 — FACIAL IDENTITYPreserve the original facial identity from Image 1 with maximum accuracy. Facial identity takes precedence over all aesthetic and geometric adjustments. Treat the original face as a protected photographic region, not a face to redesign. Preserve exact eye openings, eyelid folds, iris size, eyebrow shape, nose contours, lip shape, facial asymmetry and original expression.Maintain the original eyes, eyebrows, nose, lips, jawline, cheek structure, facial shape, age, and distinctive characteristics.Do not reshape, slim, widen, elongate, or reconstruct the face.Keep both eyes level and looking directly at the camera.Retain the original expression. Adjust only overall placement and uniform scale of the head; do not warp or reconstruct facial features.PRIORITY 4 — EXACT HAIRSTYLECompletely replace the original hairstyle with the hairstyle in Image 3.Accurately reproduce its hairline, parting, shape, length, volume, direction, and styling.Create realistic individual hair strands, natural roots, subtle highlights, and believable hair texture.Fit the hairstyle around the established anatomical head geometry.Changing the hairstyle must never change facial scale, head position, neck length, shoulder width, garment dimensions, or camera framing.PRIORITY 5 — PROFESSIONAL POSTURECreate a formal, graceful, confident studio portrait.The head and body must face directly forward with zero rotation and zero tilt.Keep the spine straight, shoulders level, neck naturally upright, and chin neutral.Avoid forward head posture, raised chin, rounded shoulders, slouching, and exaggerated body proportions.PRIORITY 6 — PREMIUM PHOTOGRAPHIC RETOUCHINGApply refined professional studio retouching while preserving the person's natural appearance.Create smooth, naturally radiant skin with realistic fine pores, subtle skin texture, balanced complexion, and a soft satin-matte finish.Gently reduce blemishes, uneven pigmentation, under-eye darkness, and excessive oily highlights.Do not apply new makeup, redraw eyebrows or eyelashes, alter lips, or change eye shape. Limit retouching to subtle exposure, color balance and photographic clarity; preserve original skin texture and facial details.Maintain consistent skin tone across the face, ears, and neck.Avoid plastic skin, waxy texture, excessive smoothing, artificial makeup, and exaggerated beauty filters.PRIORITY 7 — REALISTIC STUDIO PHOTOGRAPHYProduce the appearance of a real photograph taken in a professional portrait studio.Simulate a full-frame DSLR camera with an 85mm portrait lens, f/8, ISO 100, and eye-level camera positioning.Use large softbox lighting, balanced frontal fill light, neutral white balance, natural facial shadows, realistic depth, and refined photographic sharpness.Preserve realistic fabric texture, accurate garment colors, sharp embroidery, and authentic metallic insignia.Ensure seamless integration between the face, hair, neck, and clothing, without visible compositing edges.FINAL VALIDATIONBefore producing the final image, ensure that:The original facial identity is accurately preserved.The hairstyle matches Image 3.The garment geometry matches Image 2.The shoulders and body retain their original dimensions.The neck is naturally compact without enlarging the head.All official insignia remain accurate and undistorted.The overall portrait looks like a genuine professional studio photograph rather than a synthetic AI-generated image.FINAL OUTPUTGenerate exactly one complete, front-facing female studio ID portrait.Vertical 3:4 aspect ratio.High-resolution 1.5K.Pure solid white background.Show the entire head, complete hairstyle within the frame, both shoulders, both upper arms, and the original upper-body garment area.No watermark, no text, no decorative elements, no additional accessories.</textarea><p>ส่งไฟล์ทั้งสามโดยไม่ย่อหรือแปลง ไม่ลบพื้นหลัง ไม่ปรับภาพหลัง AI</p><button id="go">Generate</button><p id="status" role="status"></p></form></section><section id="output" hidden><h2>Seedream output</h2><img id="result"><a class="download" id="download" download="seedream-original.png">ดาวน์โหลด PNG</a></section></main><script>const form=document.getElementById('form'),go=document.getElementById('go'),statusEl=document.getElementById('status');let outputUrl;document.querySelectorAll('input[type=file]').forEach(input=>input.addEventListener('change',()=>{const img=input.previousElementSibling;if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);img.hidden=!input.files.length;if(input.files.length)img.src=URL.createObjectURL(input.files[0])}));form.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;statusEl.textContent='กำลังสร้างภาพ…';try{let r=await fetch('/api/seedream-sandbox',{method:'POST',body:new FormData(form)});if(r.status===202){const {id}=await r.json();if(!id)throw Error('Missing job ID');for(let i=0;i<150;i++){await new Promise(resolve=>setTimeout(resolve,2000));try{r=await fetch('/api/seedream-sandbox/'+encodeURIComponent(id),{cache:'no-store'})}catch{continue}if(r.status!==202)break;statusEl.textContent='กำลังสร้างภาพ… '+(i*2+2)+' วินาที'}if(r.status===202)throw Error('ยังไม่พบผลลัพธ์ กรุณาอย่าส่งงานซ้ำ')}if(!r.ok){const raw=await r.text();let message=raw;try{message=JSON.parse(raw).error||raw}catch{}throw Error(message||'Request failed')}const b=await r.blob();if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(b);document.getElementById('result').src=outputUrl;document.getElementById('download').href=outputUrl;document.getElementById('output').hidden=false;statusEl.textContent='สำเร็จ'}catch(e){statusEl.textContent=e.message}finally{go.disabled=false}});</script></html>
