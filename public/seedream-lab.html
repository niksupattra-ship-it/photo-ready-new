<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seedream Lab</title><style>*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:#f5f6f8;color:#20242b;margin:0}main{max-width:1000px;margin:32px auto;padding:20px}h1{font-size:26px;margin:0}p{color:#626975}section{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:16px 0}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,button{font:inherit}input[type=password],textarea{width:100%;padding:12px;border:1px solid #ccd0d5;border-radius:8px}textarea{min-height:220px;resize:vertical}.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{border:1px solid #ddd;padding:12px;border-radius:10px;overflow:hidden}.tile img{width:100%;height:160px;object-fit:contain;background:#fafafa}.tile input{width:100%;font-size:12px}button,a.download{display:inline-block;background:#20242b;color:white;padding:12px 22px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}#result{max-width:100%;max-height:700px;object-fit:contain;display:block;margin:15px auto}#status{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>Seedream Lab</h1><p>Flash 260915 · 2K · Smart ratio · Raw output</p><section><form id="form"><label>Ark API Key (ของคุณเอง)</label><input type="password" name="key" required autocomplete="off" placeholder="API key"><p>ไม่บันทึกคีย์หรือรูปลงฐานข้อมูล ใช้คีย์ของคุณสำหรับเรียก Seedream โดยตรงผ่านเซิร์ฟเวอร์</p><div class="refs"><div class="tile"><label>1. รูปคน</label><img hidden><input type="file" name="person" accept="image/png,image/jpeg,image/webp" required></div><div class="tile"><label>2. รูปชุด</label><img hidden><input type="file" name="outfit" accept="image/png,image/jpeg,image/webp" required></div><div class="tile"><label>3. รูปผม</label><img hidden><input type="file" name="hair" accept="image/png,image/jpeg,image/webp" required></div></div><label>Prompt</label><textarea name="prompt" required>Combine the three reference images into one photorealistic professional female studio ID portrait. Image 1 defines the person's facial identity and natural expression. Image 2 defines the exact clothing, shoulder silhouette, collar, tie and insignia. Image 3 defines the hairstyle. Preserve the facial shape, eyes, nose, lips and natural skin tone of Image 1. Use realistic adult head-to-shoulder proportions, a straight neck and an eye-level camera. Match the garment and hairstyle references faithfully. Use soft, even studio lighting and natural matte skin texture without heavy makeup or artificial shine. Front-facing, upright posture, plain white background, balanced head-and-shoulders framing, 3:4 portrait.</textarea><p>ส่งไฟล์ทั้งสามโดยไม่ย่อหรือแปลง ไม่ลบพื้นหลัง ไม่ปรับภาพหลัง AI</p><button id="go">Generate</button><p id="status" role="status"></p></form></section><section id="output" hidden><h2>Seedream output</h2><img id="result"><a class="download" id="download" download="seedream-original.png">ดาวน์โหลด PNG</a></section></main><script>const form=document.getElementById('form'),go=document.getElementById('go'),statusEl=document.getElementById('status');let outputUrl;document.querySelectorAll('input[type=file]').forEach(input=>input.addEventListener('change',()=>{const img=input.previousElementSibling;if(img.src.startsWith('blob:'))URL.revokeObjectURL(img.src);img.hidden=!input.files.length;if(input.files.length)img.src=URL.createObjectURL(input.files[0])}));form.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;statusEl.textContent='กำลังสร้างภาพ…';try{const r=await fetch('/api/seedream-sandbox',{method:'POST',body:new FormData(form)});if(!r.ok){const b=await r.json();throw Error(b.error||'Request failed')}const b=await r.blob();if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(b);document.getElementById('result').src=outputUrl;document.getElementById('download').href=outputUrl;document.getElementById('output').hidden=false;statusEl.textContent='สำเร็จ'}catch(e){statusEl.textContent=e.message}finally{go.disabled=false}});</script></html>
