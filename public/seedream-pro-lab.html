<!doctype html>
<html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Seedream Pro · หน้าทดลอง</title>
<link rel="stylesheet" href="/seedream-pro-lab.css">
<main><header><div><span class="eyebrow">IDพร้อม · LAB</span><h1>Seedream Pro</h1><p>ทดลองภาพต้นฉบับแบบเดียวกับ Playground</p></div><span class="badge">หน้าทดลองแยก</span></header>
<section id="results" hidden aria-label="ผลการทดลอง"></section>
<form id="form"><div class="reference-grid">
<label class="reference" data-kind="person"><span class="number">Image 1 · คน</span><div class="image-slot"><img hidden alt="ภาพอ้างอิงบุคคล"><span>เลือกภาพคน</span></div><input name="person" type="file" accept="image/png,image/jpeg,image/webp" required></label>
<label class="reference" data-kind="outfit"><span class="number">Image 2 · ชุด</span><div class="image-slot"><img hidden alt="ภาพอ้างอิงชุด"><span>เลือกภาพชุด</span></div><input name="outfit" type="file" accept="image/png,image/jpeg,image/webp" required></label>
<label class="reference" data-kind="hair"><span class="number">Image 3 · ผม</span><div class="image-slot"><img hidden alt="ภาพอ้างอิงทรงผม"><span>เลือกภาพทรงผม</span></div><input name="hair" type="file" accept="image/png,image/jpeg,image/webp" required></label>
</div>
<label class="field">Prompt<textarea name="prompt" id="prompt" rows="8" required placeholder="กำลังโหลด Prompt…"></textarea></label>
<div class="settings"><span>Dola-Seedream-5.0-pro</span><span>1.5K</span><span>Smart ratio</span><span>1 ภาพ</span></div>
<div class="bottom"><label class="field">ลำดับภาพ<select name="order" id="order"><option value="person-outfit-hair">คน · ชุด · ผม</option><option value="outfit-person-hair">ชุด · คน · ผม</option></select></label><label class="field key">API key สำหรับทดลอง<input name="key" type="password" autocomplete="off" required placeholder="วาง API key ของคุณ"></label><button id="go" type="submit" disabled>สร้างภาพ</button></div>
<p class="note">ส่งภาพต้นฉบับ · รับภาพดิบจาก AI · ไม่มีการตัดพื้นหลังหรือแต่งภาพต่อ<br>ใช้ API key ของคุณ ไม่ใช้เครดิตในเว็บ และไม่บันทึก key</p>
</form><div class="status-wrap"><p id="status" role="status" aria-live="polite"></p><button id="check" type="button" hidden>ตรวจผลอีกครั้ง</button></div></main>
<script type="module" src="/seedream-pro-lab.js"></script></html>
