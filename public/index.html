<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GovPhoto Auto v3 Economy</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}.w{max-width:850px;margin:auto;padding:24px}.card{background:#fff;padding:24px;border-radius:22px;border:1px solid #e5e7eb}label{display:block;font-weight:750;margin:16px 0 6px}.note{background:#eff6ff;padding:13px;border-radius:12px;color:#334155}button{width:100%;padding:16px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-size:17px;font-weight:800;margin-top:20px}img{display:block;max-width:450px;width:100%;margin:20px auto 0;border-radius:12px}</style>
<div class=w><div class=card><h1>GovPhoto Auto v3</h1><div class=note>โหมดประหยัด: 1 การสร้าง = เรียก AI สูงสุด 1 ครั้ง • Resize / จัดไฟล์ 900×1200 ทำในเซิร์ฟเวอร์ ไม่เรียก AI เพิ่ม</div>
<label>รูปบุคคล</label><input id=p type=file accept="image/*"><label>Template ชุดจริง</label><input id=u type=file accept="image/*"><label>Template ทรงผม (ไม่บังคับ)</label><input id=h type=file accept="image/*">
<button id=b>สร้างรูปข้าราชการ</button><p id=s></p><img id=o>
<script>b.onclick=async()=>{if(!p.files[0]||!u.files[0])return s.textContent="กรุณาเลือกรูปบุคคลและชุด";b.disabled=true;s.textContent="กำลังสร้างแบบประหยัด…";let f=new FormData;f.append("portrait",p.files[0]);f.append("uniform",u.files[0]);if(h.files[0])f.append("hair",h.files[0]);try{let r=await fetch("/api/create",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error);o.src=d.image;s.textContent=`เสร็จแล้ว • AI ${d.aiCalls} ครั้ง • ${d.width}×${d.height}px`}catch(e){s.textContent=e.message}finally{b.disabled=false}}</script></div></div>
