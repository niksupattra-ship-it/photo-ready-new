<!doctype html><html lang=th><meta charset=utf-8><meta name=viewport content="width=device-width"><title>GovPhoto v5.2</title><style>body{font-family:system-ui;background:#f5f7fb;margin:auto;max-width:800px;padding:24px}main{background:white;padding:24px;border-radius:20px}label{display:block;font-weight:700;margin:16px 0 6px}button{width:100%;padding:16px;margin-top:20px;background:#2563eb;color:white;border:0;border-radius:12px;font-size:17px;font-weight:800}img{max-width:450px;width:100%;display:block;margin:20px auto}.ok{background:#dcfce7;padding:12px;border-radius:12px}</style><main><h1>GovPhoto v5.2</h1><p class=ok>Browser Cutout — ลบพื้นหลังบนเครื่องผู้ใช้ • Render ไม่โหลดโมเดล • ชุด Pixel Locked</p><label>รูปบุคคล</label><input id=p type=file accept="image/*"><label>Template ชุด</label><input id=u type=file accept="image/*"><button id=b>ตัดหัวและประกอบอัตโนมัติ</button><p id=s></p><img id=o><script type=module>import removeBackground from"https://esm.sh/@imgly/background-removal@1.7.0?bundle";async function crop(blob){let x=await createImageBitmap(blob),c=document.createElement("canvas");c.width=x.width;c.height=Math.max(1,Math.round(x.height*.62));c.getContext("2d").drawImage(x,0,0);return await new Promise(r=>c.toBlob(r,"image/png",1))}b.onclick=async()=>{if(!p.files[0]||!u.files[0])return s.textContent="กรุณาเลือกรูปทั้งสอง";b.disabled=true;try{s.textContent="กำลังลบพื้นหลังใน Browser… ครั้งแรกอาจใช้เวลานาน";let transparent=await removeBackground(p.files[0]),head=await crop(transparent);s.textContent="กำลังจัดสัดส่วนและประกอบ…";let f=new FormData;f.append("head",head,"head.png");f.append("uniform",u.files[0]);let r=await fetch("/api/create",{method:"POST",body:f}),raw=await r.text(),d;try{d=JSON.parse(raw)}catch{throw Error(`Server ตอบไม่สมบูรณ์ HTTP ${r.status}`)}if(!r.ok)throw Error(d.error);o.src=d.image;s.textContent=`เสร็จ • Browser Cutout ✓ • ชุดล็อก ✓ • AI ${d.aiCalls} ครั้ง`}catch(e){console.error(e);s.textContent="ผิดพลาด: "+e.message}finally{b.disabled=false}}</script></main>
