<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GovPhoto v5</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:system-ui,sans-serif;color:#172033}.w{max-width:900px;margin:auto;padding:24px}.c{background:#fff;padding:24px;border:1px solid #e5e7eb;border-radius:22px}.tag{background:#dcfce7;color:#166534;padding:7px 12px;border-radius:99px;font-weight:800;display:inline-block}.flow{background:#f8fafc;padding:14px;border-radius:14px;line-height:1.8;margin:16px 0}label{display:block;font-weight:750;margin:15px 0 6px}button{width:100%;padding:16px;margin-top:20px;border:0;border-radius:13px;background:#2563eb;color:white;font-size:17px;font-weight:800}img{display:block;max-width:450px;width:100%;margin:20px auto;border-radius:12px}</style>
<div class=w><div class=c><span class=tag>v5 • Head + Neck Pipeline</span><h1>Photoshop-style Government Photo</h1>
<div class=flow><b>โครงสร้าง:</b> ตัดหัว/ผม → วัดสัดส่วน → วางบนชุด Pixel-Locked → กำหนดพื้นที่คอเฉพาะจุด → ประกอบ → 900×1200<br><b>ชุด:</b> ไม่ส่งเข้า Generative AI</div>
<label>รูปบุคคล/ส่วนหัว</label><input id=h type=file accept="image/*"><label>Template ชุดจริง</label><input id=u type=file accept="image/*"><label>Head/Hair Mask (ถ้ามี)</label><input id=m type=file accept="image/*">
<button id=b>สร้างรูปอัตโนมัติ</button><p id=s></p><img id=o>
<script>b.onclick=async()=>{if(!h.files[0]||!u.files[0])return s.textContent="กรุณาเลือกรูปและชุด";b.disabled=true;s.textContent="กำลังตัดต่อแบบ Layer…";let f=new FormData;f.append("head",h.files[0]);f.append("uniform",u.files[0]);if(m.files[0])f.append("headMask",m.files[0]);try{let r=await fetch("/api/create",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error);o.src=d.image;s.textContent=`เสร็จ • AI ${d.aiCalls} ครั้ง • สัดส่วนไหล่/หัว ${d.metrics.ratio} • ชุด Pixel Locked`}catch(e){s.textContent=e.message}finally{b.disabled=false}}</script></div></div>
