<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GovPhoto Auto v2</title><style>body{font-family:system-ui;background:#f5f7fb;margin:auto;max-width:800px;padding:24px}main{background:white;padding:22px;border-radius:20px}label{display:block;margin:15px 0 5px;font-weight:700}button{width:100%;padding:16px;margin-top:20px;background:#2563eb;color:white;border:0;border-radius:12px;font-size:17px}img{max-width:100%;margin-top:20px;border-radius:12px}</style><main><h1>GovPhoto Auto v2</h1><p>Proportion Lock — ป้องกันหัวใหญ่และจัดคอ/ไหล่อัตโนมัติ</p><label>รูปบุคคล</label><input id=p type=file accept="image/*"><label>Template ชุดจริง</label><input id=u type=file accept="image/*"><label>ทรงผม (ไม่บังคับ)</label><input id=h type=file accept="image/*"><button id=b>สร้างรูปอัตโนมัติ</button><p id=s></p><img id=o><script>b.onclick=async()=>{if(!p.files[0]||!u.files[0])return s.textContent="กรุณาเลือกรูปบุคคลและชุด";b.disabled=true;s.textContent="กำลังสร้าง…";let f=new FormData;f.append("portrait",p.files[0]);f.append("uniform",u.files[0]);if(h.files[0])f.append("hair",h.files[0]);try{let r=await fetch("/api/create",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error);o.src=d.image;s.textContent="เสร็จแล้ว"}catch(e){s.textContent=e.message}finally{b.disabled=false}}</script></main></html>
