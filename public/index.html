<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GovPhoto v4 Pixel Locked</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;font-family:system-ui,sans-serif;color:#172033}.w{max-width:880px;margin:auto;padding:24px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px}.tag{display:inline-block;background:#dcfce7;color:#166534;padding:7px 11px;border-radius:999px;font-weight:700}.info{background:#eff6ff;padding:14px;border-radius:14px;margin:15px 0;line-height:1.6}label{display:block;font-weight:750;margin:16px 0 6px}button{width:100%;padding:16px;border:0;border-radius:13px;background:#2563eb;color:#fff;font-size:17px;font-weight:800;margin-top:22px}img{display:block;width:min(100%,450px);margin:20px auto;border-radius:12px}</style>
<div class=w><div class=c><span class=tag>v4 • Pixel Locked</span><h1>รูปข้าราชการแบบ Photoshop Automation</h1>
<div class=info><b>ชุดไม่ผ่าน Generative AI</b><br>Template ชุดจริงถูกใช้เป็นพิกเซลต้นฉบับ จึงไม่สร้างเข็ม อินทรธนู กระดุม หรือรายละเอียดชุดใหม่</div>
<label>1. รูปบุคคล</label><input id=p type=file accept="image/*"><label>2. Template ชุดจริง</label><input id=u type=file accept="image/*"><label>3. Mask บุคคล PNG/ขาวดำ (ถ้ามี)</label><input id=m type=file accept="image/*">
<button id=b>ประกอบรูปอัตโนมัติ</button><p id=s></p><img id=o>
<script>b.onclick=async()=>{if(!p.files[0]||!u.files[0])return s.textContent="กรุณาเลือกรูปบุคคลและชุด";b.disabled=true;s.textContent="กำลังประกอบ Layer แบบ Pixel Locked…";let f=new FormData;f.append("person",p.files[0]);f.append("uniform",u.files[0]);if(m.files[0])f.append("personMask",m.files[0]);try{let r=await fetch("/api/create",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error);o.src=d.image;s.textContent=`เสร็จแล้ว • AI ${d.aiCalls} ครั้ง • ${d.uniformMode} • ${d.width}×${d.height}`}catch(e){s.textContent=e.message}finally{b.disabled=false}}</script></div></div>
