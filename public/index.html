<!doctype html><html lang=th><meta charset=utf-8><meta name=viewport content="width=device-width"><title>GovPhoto v5.1</title><style>body{font-family:system-ui;background:#f5f7fb;margin:auto;max-width:800px;padding:24px}main{background:#fff;padding:24px;border-radius:20px}label{display:block;font-weight:700;margin:16px 0 6px}button{width:100%;padding:16px;margin-top:20px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:17px;font-weight:800}img{max-width:450px;width:100%;display:block;margin:20px auto}.ok{background:#dcfce7;padding:12px;border-radius:12px}</style><main><h1>GovPhoto v5.1</h1><p class=ok>Auto Head Extraction — ไม่ต้องอัปโหลด Mask เอง • ชุด Pixel Locked</p><label>รูปบุคคล</label><input id=p type=file accept="image/*"><label>Template ชุด</label><input id=u type=file accept="image/*"><button id=b>ตัดหัวและประกอบอัตโนมัติ</button><p id=s></p><img id=o><script>b.onclick=async()=>{if(!p.files[0]||!u.files[0])return s.textContent="กรุณาเลือกรูปทั้งสอง";b.disabled=true;s.textContent="กำลังตัดพื้นหลัง/แยกหัว/จัดสัดส่วน…";let f=new FormData;f.append("person",p.files[0]);f.append("uniform",u.files[0]);try{let r=await fetch("/api/create",{method:"POST",body:f}),d=await r.json();if(!r.ok)throw Error(d.error);o.src=d.image;s.textContent=`เสร็จ • Auto Mask ${d.autoMask?"✓":"✗"} • ชุดล็อก ${d.uniformLocked?"✓":"✗"} • ไหล่/หัว ${d.metrics.ratio}`}catch(e){s.textContent="ผิดพลาด: "+e.message}finally{b.disabled=false}}</script></main>
