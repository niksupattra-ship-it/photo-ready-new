[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120

# Keep the prior deployment serving in-flight portrait AI jobs while new code
# becomes live. Prevent SIGTERM from interrupting a 1-3 minute generation.
# Existing DB-backed queued-job recovery remains the fallback for longer work.
overlapSeconds = "300"
